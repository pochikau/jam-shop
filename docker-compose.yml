services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jamuser
      POSTGRES_PASSWORD: jamsecret
      POSTGRES_DB: jamdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jamuser -d jamdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    expose:
      - "5000"
    environment:
      DATABASE_URL: postgresql://jamuser:jamsecret@db:5432/jamdb
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      HTTPS_ENABLED: ${HTTPS_ENABLED:-0}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/options-ssl.conf:/etc/nginx/options-ssl.conf:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    profiles:
      - renew

volumes:
  postgres_data:
  certbot_webroot:
  certbot_conf:
